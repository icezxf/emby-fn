services:
  fnos-emby-gateway:
    build: .
    container_name: fnos-emby-gateway
    ports:
      - "8007:8007"
    environment:
      - EMBY_URL=http://192.168.1.100:8096
      - EMBY_API_KEY=你的EmbyAPIKey
      - EMBY_USER_ID=你的Emby用户ID
      - LISTEN_ADDR=0.0.0.0:8007
      - RUST_LOG=info
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
